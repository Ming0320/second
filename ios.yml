name: Build Unsigned iOS IPA
on: [push, workflow_dispatch]
jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and sync
        run: |
          if [ ! -f "package.json" ]; then npm init -y; fi
          npm install
          npm install --save-dev @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5
          npx cap init FruitCatch com.ming.fruitcatch --web-dir public || true
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install || true && cd ../..
      - name: Disable signing
        run: python3 scripts/patch_sign.py
      - name: Build archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO -archivePath build/App.xcarchive archive
          mkdir -p build/output
          cp -r build/App.xcarchive/Products/Applications/*.app build/output/ || true
          cd build/output
          zip -r ../../ios-app-unsigned.ipa *.app || true
          cd ../..
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ios/App/ios-app-unsigned.ipa
          if-no-files-found: ignore
