name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install
      - run: npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5
      - run: npx cap init FruitCatch com.ming.fruitcatch --web-dir public || true
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - run: cd ios/App && pod install || true

      - name: Build Unsigned Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" CODE_SIGNING_ALLOWED=NO \
            -archivePath build/App.xcarchive archive

      - name: Package IPA
        run: |
          cd ios/App
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r ../../ios-app-unsigned.ipa Payload
          cd ../..

      - uses: actions/upload-artifact@v6
        with:
          name: ios-app-unsigned
          path: ios/App/ios-app-unsigned.ipa
          retention-days: 7
