name: Build Unsigned iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5

      - name: Cap init
        run: npx cap init FruitCatch com.ming.fruitcatch --web-dir public || true

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Sync web assets
        run: npx cap sync ios

      - name: Install Pods
        run: |
          cd ios/App
          pod install || true
          cd ../..

      - name: Patch Xcode project
        run: |
          python3 - <<'PY'
          import re
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          s = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = "";', s)
          s = re.sub(r'CODE_SIGN_IDENTITY = [^;]*;', 'CODE_SIGN_IDENTITY = "";', s)
          if 'CODE_SIGNING_ALLOWED' not in s:
              s = s.replace('GCC_OPTIMIZATION_LEVEL = 0;',
                            'GCC_OPTIMIZATION_LEVEL = 0;\n\t\t\tCODE_SIGNING_ALLOWED = NO;')
          open(p, 'w').write(s)
          PY

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO

      - name: Make unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app ipa/Payload/
          cd ipa && zip -r ../FruitCatch.ipa Payload && cd ..
          ls -la FruitCatch.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FruitCatch-unsigned-IPA
          path: FruitCatch.ipa
          retention-days: 30
