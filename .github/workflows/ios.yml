name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install and sync
        run: |
          if [ ! -f "package.json" ]; then npm init -y; fi
          npm install
          npm install typescript
          npm install --save-dev @capacitor/cli@5 @capacitor/core@5 @capacitor/ios@5
          npx cap init FruitCatch com.ming.fruitcatch --web-dir public || true
          npx cap add ios || true
          npx cap sync ios
          
      - name: Pod install
        run: cd ios/App && pod install || true
        
      - name: Build archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" CODE_SIGNING_ALLOWED=NO \
            -archivePath build/App.xcarchive archive
            
      - name: Package IPA
        run: |
          cd ios/App
          mkdir -p build/output
          cp -r build/App.xcarchive/Products/Applications/*.app build/output/ || true
          cd build/output
          zip -r ../../ios-app-unsigned.ipa *.app || true
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ios/App/ios-app-unsigned.ipa
          retention-days: 7
